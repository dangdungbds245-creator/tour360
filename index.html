<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phòng Tour 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar danh sách dự án cố định bên trái, khung 360 chiếm toàn bộ phần còn lại */
:root{
  --side:#14232b; --side-2:#1c3039; --side-line:#2a424d;
  --ink:#e8efef; --muted:#93a8ad; --accent:#e0a95b; --accent-ink:#1a1206;
  --stage:#0b1418; --danger:#e07a6b;
  --font:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,sans-serif;
  --w:300px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font:14px/1.45 var(--font);display:flex;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Sidebar */
aside{width:var(--w);flex:none;background:var(--side);border-right:1px solid var(--side-line);display:flex;flex-direction:column;transition:margin .2s}
body.collapsed aside{margin-left:calc(-1 * var(--w))}
.brand{padding:18px 18px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.01em}
.brand h1 span{color:var(--accent)}
.count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.search{margin:0 14px 10px;position:relative}
.search input{width:100%;background:var(--side-2);border:1px solid var(--side-line);border-radius:8px;padding:9px 12px}
.search input::placeholder{color:var(--muted)}
ul{list-style:none;margin:0;padding:0 8px;overflow-y:auto;flex:1}
li{display:flex;align-items:center;border-radius:8px;margin-bottom:2px}
li .pick{flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px 10px;cursor:pointer;border-radius:8px}
li .pick b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li .pick small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li:hover{background:var(--side-2)}
li.active{background:var(--side-2);box-shadow:inset 3px 0 0 var(--accent)}
li.active .pick b{color:var(--accent)}
li .tools{display:none;gap:2px;padding-right:6px}
li:hover .tools,li.active .tools,li:focus-within .tools{display:flex}
.icon{background:none;border:0;color:var(--muted);width:28px;height:28px;border-radius:6px;cursor:pointer;display:grid;place-items:center}
.icon:hover{background:var(--side-line);color:var(--ink)}
.icon.del:hover{color:var(--danger)}
li.confirm{background:#3a2420}
li.confirm .pick small{color:var(--danger)}
.empty-list{color:var(--muted);padding:12px 12px;font-size:13px}

.foot{border-top:1px solid var(--side-line);padding:12px 14px;display:grid;gap:8px}
.btn{border:1px solid var(--side-line);background:var(--side-2);border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.row{display:flex;gap:8px}.row .btn{flex:1;font-size:12.5px;padding:7px 8px}

/* Form */
form{display:grid;gap:8px}
form[hidden]{display:none}
label{font-size:12px;color:var(--muted);display:grid;gap:4px}
form input,form textarea{background:var(--stage);border:1px solid var(--side-line);border-radius:7px;padding:8px 10px;width:100%}
form textarea{min-height:110px;resize:vertical;font-size:12.5px}
.hint{font-size:11.5px;color:var(--muted);margin:0}
.tabs{display:flex;gap:4px;font-size:12.5px}
.tabs button{flex:1;background:none;border:1px solid var(--side-line);border-radius:6px;padding:5px;cursor:pointer;color:var(--muted)}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}

/* Stage */
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--side);border-bottom:1px solid var(--side-line);min-height:48px}
.bar .title{flex:1;min-width:0}
.bar .title b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .title small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .btn{padding:6px 10px;font-size:12.5px;white-space:nowrap}
.frame{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--stage)}
.welcome{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
.welcome div{max-width:420px}
.welcome h2{font-size:22px;margin:0 0 8px;text-wrap:balance}
.welcome p{color:var(--muted);margin:0 0 6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:700px){
  :root{--w:min(86vw,300px)}
  aside{position:absolute;inset:0 auto 0 0;z-index:5}
  .bar .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){aside,.toast{transition:none}}
</style>
</head>
<body>
<aside>
  <div class="brand"><h1>Tour <span>360°</span></h1><span class="count" id="count"></span></div>
  <div class="search"><input id="q" type="search" placeholder="Tìm dự án, khu vực…" autocomplete="off"></div>
  <ul id="list"></ul>
  <div class="foot">
    <button class="btn primary" id="openAdd">+ Thêm dự án</button>
    <form id="form" hidden>
      <div class="tabs"><button type="button" id="tOne" aria-pressed="true">Một dự án</button><button type="button" id="tMany" aria-pressed="false">Thêm nhiều</button></div>
      <div id="one">
        <div style="display:grid;gap:8px">
          <label>Tên dự án<input id="fName" placeholder="VD: Sun Symphony Residence"></label>
          <label>Khu vực / ghi chú<input id="fNote" placeholder="VD: Sơn Trà, Đà Nẵng"></label>
          <label>Link 360 (hoặc mã nhúng iframe)<input id="fUrl" placeholder="https://…"></label>
        </div>
      </div>
      <div id="many" hidden>
        <label>Mỗi dòng: Tên | Link | Khu vực (tuỳ chọn)<textarea id="fBulk" placeholder="Dự án A | https://kuula.co/share/... | Hải Châu&#10;Dự án B | https://... "></textarea></label>
      </div>
      <p class="hint" id="fErr"></p>
      <div class="row"><button type="button" class="btn" id="cancel">Huỷ</button><button class="btn primary" id="save">Lưu</button></div>
    </form>
    <div class="row">
      <button class="btn" id="exp" title="Tải file sao lưu danh sách">Sao lưu</button>
      <button class="btn" id="imp" title="Nạp danh sách từ file sao lưu">Nạp file</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </div>
</aside>

<main>
  <div class="bar">
    <button class="icon" id="toggle" title="Ẩn/hiện danh sách" aria-label="Ẩn hoặc hiện danh sách">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="title"><b id="curName">Chưa chọn dự án</b><small id="curNote"></small></div>
    <button class="btn hide-sm" id="copy" disabled>Sao chép link</button>
    <a class="btn" id="newtab" target="_blank" rel="noopener" style="text-decoration:none;color:inherit" hidden>Mở tab mới</a>
    <button class="btn" id="full" disabled>Toàn màn hình</button>
  </div>
  <div class="frame" id="frame">
    <div class="welcome" id="welcome"><div>
      <h2>Thêm link 360 đầu tiên</h2>
      <p>Bấm <b>+ Thêm dự án</b> ở cột trái, dán link tour 360 (Kuula, 3DVista, Matterport, Panoee…) hoặc cả đoạn mã nhúng iframe.</p>
      <p>Danh sách lưu ngay trên máy này. Dùng <b>Sao lưu</b> để mang sang máy khác.</p>
    </div></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const KEY = 'tour360.projects.v1';
const $ = id => document.getElementById(id);
// Dự án có sẵn: hiển thị cho người mở link lần đầu
const DEFAULTS = [
  {id:'sun-galaxy', name:'Sun Galaxy Complex', note:'', url:'https://kuula.co/share/collection/7THrc'},
  {id:'fours-tower', name:'Fours Tower', note:'', url:'https://kuula.co/share/LTTwZ?logo=1&info=1&fs=0&vr=0&gyro=0&thumbs=1&keys=0'},
  {id:'spana-tower', name:'Spana Tower', note:'', url:'https://kuula.co/share/hVKVY?logo=1&info=1&fs=1&vr=0&sd=1&thumbs=1'},
  {id:'cora-tower', name:'Cora Tower', note:'', url:'https://kuula.co/share/h21k4?logo=1&info=1&fs=1&vr=0&sd=1&thumbs=1'},
  {id:'sun-river-polis', name:'Sun River Polis', note:'', url:'https://kuula.co/share/hsdvB?logo=1&info=1&fs=1&vr=0&sd=1&thumbs=1'},
  {id:'symphony-5', name:'Symphony 5', note:'', url:'https://kuula.co/share/collection/7MjrB'},
  {id:'capital-square', name:'Capital Square', note:'', url:'https://momento360.com/e/u/69b91cf693694101888a56341dd535d1?heading=-90.36&pitch=-6.54&field-of-view=75&size=medium&display-plan=true'},
  {id:'s-light-tower', name:'S-Light Tower', note:'', url:'https://kuula.co/share/collection/7TqX8?logo=1&info=1&fs=0&vr=0&gyro=0&thumbs=1&keys=0'}
];
let items = load(), current = null, pendingDel = null, editing = null;

function removedIds(){ try{ return JSON.parse(localStorage.getItem(KEY+'.removed')) || []; }catch(e){ return []; } }
function load(){
  let list = null;
  try{ list = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if (!Array.isArray(list)) return DEFAULTS.map(p=>({...p}));
  const have = new Set(list.map(p=>p.id)), gone = new Set(removedIds());
  for (const d of DEFAULTS) if (!have.has(d.id) && !gone.has(d.id)) list.push({...d});
  return list;
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){ toast('Không lưu được trên trình duyệt này'); } }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Chấp nhận link thường hoặc cả đoạn <iframe src="...">
function cleanUrl(raw){
  raw = (raw||'').trim();
  const m = raw.match(/src\s*=\s*["']([^"']+)["']/i);
  if (m) raw = m[1];
  raw = raw.replace(/&amp;/g,'&');
  if (raw && !/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
  try{ return toEmbed(new URL(raw)).href; }catch(e){ return null; }
}
// Trang xem (kuula.co/post/...) chặn nhúng; đổi sang link nhúng kuula.co/share/...
function toEmbed(u){
  if (/(^|\.)kuula\.co$/i.test(u.hostname)){
    const m = u.pathname.match(/^\/post\/(?:n\d+\/)?(.+)$/i);
    if (m) u.pathname = '/share/' + m[1];
  }
  return u;
}
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }

function render(){
  const q = $('q').value.trim().toLowerCase();
  const shown = items.filter(p => !q || (p.name+' '+(p.note||'')).toLowerCase().includes(q));
  $('count').textContent = items.length ? items.length + ' dự án' : '';
  $('list').innerHTML = shown.length ? shown.map(p => {
    const conf = pendingDel === p.id;
    return `<li class="${p.id===current?'active':''} ${conf?'confirm':''}" data-id="${p.id}">
      <button class="pick" data-act="open"><b>${esc(p.name)}</b><small>${conf ? 'Bấm 🗑 lần nữa để xoá' : esc(p.note || host(p.url))}</small></button>
      <span class="tools">
        <button class="icon" data-act="edit" title="Sửa" aria-label="Sửa"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
        <button class="icon del" data-act="del" title="Xoá" aria-label="Xoá"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
      </span></li>`;
  }).join('') : `<li class="empty-list">${items.length ? 'Không tìm thấy dự án phù hợp.' : 'Chưa có dự án nào.'}</li>`;
}

function show(id){
  const p = items.find(x => x.id === id);
  if (!p) return;
  current = id;
  try{ localStorage.setItem(KEY+'.last', id); }catch(e){}
  $('curName').textContent = p.name;
  $('curNote').textContent = (p.note ? p.note + ' · ' : '') + host(p.url);
  $('welcome').hidden = true;
  let f = $('frame').querySelector('iframe');
  if (!f){
    f = document.createElement('iframe');
    f.allow = 'fullscreen; xr-spatial-tracking; gyroscope; accelerometer; vr';
    f.allowFullscreen = true;
    $('frame').appendChild(f);
  }
  if (f.src !== p.url) f.src = p.url;
  $('newtab').href = p.url; $('newtab').hidden = false;
  $('copy').disabled = $('full').disabled = false;
  if (matchMedia('(max-width:700px)').matches) document.body.classList.add('collapsed');
  render();
}

$('list').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const id = btn.closest('li').dataset.id, act = btn.dataset.act;
  if (act === 'open'){ pendingDel = null; show(id); }
  if (act === 'del'){
    if (pendingDel === id){
      items = items.filter(x => x.id !== id); persist(); pendingDel = null;
      if (DEFAULTS.some(d=>d.id===id)) try{ localStorage.setItem(KEY+'.removed', JSON.stringify([...removedIds(), id])); }catch(e){}
      if (current === id){ current = null; $('frame').querySelector('iframe')?.remove(); $('welcome').hidden = false;
        $('curName').textContent='Chưa chọn dự án'; $('curNote').textContent=''; $('newtab').hidden=true; $('copy').disabled=$('full').disabled=true; }
      toast('Đã xoá'); render();
    } else { pendingDel = id; render(); setTimeout(()=>{ if(pendingDel===id){pendingDel=null;render();} }, 4000); }
  }
  if (act === 'edit'){
    const p = items.find(x => x.id === id); editing = id;
    openForm(false); $('fName').value = p.name; $('fNote').value = p.note||''; $('fUrl').value = p.url;
    $('save').textContent = 'Cập nhật';
  }
});

let bulk = false;
function setMode(m){ bulk = m; $('one').hidden = m; $('many').hidden = !m; $('tOne').setAttribute('aria-pressed', !m); $('tMany').setAttribute('aria-pressed', m); }
function openForm(m){ $('form').hidden = false; $('openAdd').hidden = true; $('fErr').textContent=''; setMode(m); $('tMany').hidden = !!editing; (m?$('fBulk'):$('fName')).focus(); }
function closeForm(){ $('form').hidden = true; $('openAdd').hidden = false; $('form').reset(); editing = null; $('save').textContent='Lưu'; $('tMany').hidden=false; }
$('openAdd').onclick = () => { editing = null; openForm(false); };
$('cancel').onclick = closeForm;
$('tOne').onclick = () => setMode(false);
$('tMany').onclick = () => setMode(true);

$('form').addEventListener('submit', e => {
  e.preventDefault();
  if (!bulk){
    const name = $('fName').value.trim(), url = cleanUrl($('fUrl').value), note = $('fNote').value.trim();
    if (!name) return $('fErr').textContent = 'Nhập tên dự án.';
    if (!url) return $('fErr').textContent = 'Link chưa đúng. Dán link bắt đầu bằng https:// hoặc mã nhúng iframe.';
    if (editing){ Object.assign(items.find(x=>x.id===editing), {name,url,note}); persist(); const id=editing; closeForm(); toast('Đã cập nhật'); show(id); }
    else { const p = {id:uid(), name, url, note}; items.push(p); persist(); closeForm(); toast('Đã thêm '+name); show(p.id); }
  } else {
    const lines = $('fBulk').value.split('\n').map(s=>s.trim()).filter(Boolean);
    let added = 0, bad = [];
    for (const [i,l] of lines.entries()){
      const parts = l.split('|').map(s=>s.trim());
      let name = parts[0], url = cleanUrl(parts[1]||''), note = parts.slice(2).join(' | ');
      if (parts.length === 1){ url = cleanUrl(parts[0]); name = url ? host(url) : ''; }
      if (name && url){ items.push({id:uid(), name, url, note}); added++; } else bad.push(i+1);
    }
    if (!added) return $('fErr').textContent = 'Không đọc được dòng nào. Mẫu: Tên | https://link | Khu vực';
    persist(); closeForm(); toast(`Đã thêm ${added} dự án` + (bad.length ? `, bỏ qua dòng ${bad.join(', ')}` : ''));
    show(items[items.length-added].id);
  }
});

$('q').addEventListener('input', render);
$('toggle').onclick = () => document.body.classList.toggle('collapsed');
$('full').onclick = () => { const f = $('frame'); (f.requestFullscreen ? f.requestFullscreen() : Promise.reject()).catch(()=>toast('Trình duyệt không cho phép toàn màn hình')); };
$('copy').onclick = () => {
  const p = items.find(x=>x.id===current); if (!p) return;
  navigator.clipboard.writeText(p.url).then(()=>toast('Đã sao chép link gửi khách'), ()=>toast(p.url));
};
$('exp').onclick = () => {
  const blob = new Blob([JSON.stringify(items,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'tour360-sao-luu-' + new Date().toISOString().slice(0,10) + '.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};
$('imp').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try{
    const data = JSON.parse(await f.text());
    const have = new Set(items.map(x=>x.url)); let n = 0;
    for (const p of data){ const url = cleanUrl(p.url); if (p.name && url && !have.has(url)){ items.push({id:uid(), name:String(p.name), url, note:String(p.note||'')}); have.add(url); n++; } }
    persist(); render(); toast(`Đã nạp ${n} dự án mới`);
  }catch(err){ toast('File không đúng định dạng sao lưu'); }
  e.target.value = '';
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('form').hidden) closeForm(); });

// Sửa lại các link đã lưu trước đó
let fixed = 0;
for (const p of items){ const u = cleanUrl(p.url); if (u && u !== p.url){ p.url = u; fixed++; } }
if (fixed) persist();
render();
let last; try{ last = localStorage.getItem(KEY+'.last'); }catch(e){}
if (last && items.some(x=>x.id===last)) show(last); else if (items[0]) show(items[0].id);
</script>
</body>
</html>
